name: Refresh investor stats

on:
  schedule:
    - cron: "15 22 * * *" # 06:15 Malaysia time, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch aggregates from PostHog
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: node scripts/fetch-investor-stats.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investors/stats.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Investor stats: daily refresh"
          git push
